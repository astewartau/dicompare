[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.css,conftest.py'
check-hidden = true
# some special typo-close "words"
ignore-regex = '\b(adRes)\b'
# ALS = Amyotrophic Lateral Sclerosis (medical term, not typo for "also")
ignore-words-list = 'nd,te,ALS,Reson,infarction'

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.coverage.run]
source = ["dicompare"]
omit = [
    "dicompare/tests/*",
]

[tool.coverage.report]
# Every non-test module is measured (no files omitted). Keep this at 90 and cover
# new code rather than lowering the gate or omitting files. Genuinely unreachable
# lines (e.g. Pyodide-only branches) should be marked with an explicit
# "pragma: no cover" plus a comment, not excluded wholesale.
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
